name: Deploy Temporal Services

on:
  push:
    branches:
      - main
    paths:
      - 'temporal/**'
      - 'temporal-rest-gateway/**'
      - '.github/workflows/deploy-temporal.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_WORKER: ${{ github.repository }}-temporal-worker
  IMAGE_NAME_GATEWAY: ${{ github.repository }}-temporal-rest-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}

      - name: Build and push Temporal Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./temporal/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}

      - name: Extract metadata (tags, labels) for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}

      - name: Build and push Temporal REST Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./temporal-rest-gateway
          file: ./temporal-rest-gateway/Dockerfile
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Placeholder
        run: |
          echo "Placeholder for deployment step."
          echo "In the future, we can add an SSH step or webhook to trigger deployment."
          # Example SSH deployment:
          # ssh user@host "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}:latest && docker-compose up -d"
